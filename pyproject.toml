[project]
name = "aid-impact-rl"
version = "0.1.0"
description = "Reinforcement learning for NGO aid allocation: DQN, REINFORCE, PPO and A2C trained with TorchRL on a custom environment."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.26",
    "torch>=2.5.0",
    "torchrl>=0.15.0",
    "tensordict>=0.15.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
